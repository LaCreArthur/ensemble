name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Each Mac's model and macOS version, the speakers you ticked, and the Ensemble version.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Run `/usr/bin/log show --last 10m --predicate 'subsystem == \"com.lacrearthur.duet\"' > ensemble.log` right after the problem and attach the file."
